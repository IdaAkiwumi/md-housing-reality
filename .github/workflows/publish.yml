name: Publish Maryland Housing Reality

on:
  push:
    branches: [main, master]
  schedule:
    # 15th of each month at 08:23 UTC
    - cron: "23 8 15 * *"
  workflow_dispatch:
    inputs:
      send_newsletter:
        description: "Send monthly Rent Watch newsletter (skipped if already sent this month)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Census and Zillow data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Validate the payload
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python -m unittest discover -s tests -v

      - name: Send monthly Rent Watch email
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_newsletter == true)
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/send_newsletter.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4